name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      real_tensors:
        description: Also run the optional CPU PyTorch extraction checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend offline characterisation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Database/backend/requirements*.txt
      - run: python -m pip install -r Database/backend/requirements-test.txt
      - name: Backend tests (real-tensor tests explicitly skip without torch)
        run: python -m pytest Database/backend/tests -q -ra
      - name: Backup and questionnaire regression tests
        run: |
          python tools/test_local_state_backup.py
          python tools/gui-questionnaire/test_server.py

  ui:
    name: UI lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Database/UI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Database/UI/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  real-tensors:
    name: Optional real tensor extraction (CPU)
    if: github.event_name == 'workflow_dispatch' && inputs.real_tensors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r Database/backend/requirements-test.txt
      # Match the existing CPU runtime pin; this does not require a GPU or LoRAs.
      - run: python -m pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Require real torch before tests (an import failure must not become a skip)
        run: python -c "import torch; assert torch.ones(2).numel() == 2; print(torch.__version__)"
      - run: python -m pytest Database/backend/tests -q -ra
